%Practice
#✍️ Free practice editor|Type any Python and press Run. If something breaks, I’ll explain the error in plain words. Use the Ask box on the right for help.
@Part I: Beginner — Python Foundations & Office Automation
%Module 1: Python Basics — Syntax, Variables & Operators
#1.1 Your first program: print(), comments & syntax|print() shows output. A # starts a comment that Python ignores. Python is case-sensitive, and indentation matters.
$# Comments start with #§print("Python is fun")§print(2 + 3)
>Print exactly: Hello, Python!|⟦print("Hello, Python!")⟧||Hello, Python!|Put the text in quotes inside print().
>Print two lines: Welcome and then Learn Python.|⟦print("Welcome")§print("Learn Python")⟧||Welcome§Learn Python|Use one print() per line.
#1.2 Variables & naming rules|A variable is a name that stores a value, like age = 30. Names use letters, digits and _, cannot start with a digit, and are case-sensitive. Use clear snake_case names.
$city = "Pune"§temp = 31.5§is_hot = temp > 30§print(city, temp, is_hot)
>Store 12 in items and 5 in price, then print items * price.|⟦items = 12§price = 5§print(items * price)⟧||60|Assign with =, then multiply the two names.
>Swap the values of a and b, then print a and b on one line.|a = 1§b = 2§⟦a, b = b, a§print(a, b)⟧||2 1|Python can swap with a, b = b, a.
#1.3 Numbers & arithmetic operators|int is a whole number and float has decimals. + - * / work as usual; // is floor division, % is the remainder, ** is a power. Brackets change the order of operations.
$print(10 / 4)§print(10 // 4)§print(10 % 4)§print(3 ** 2 + 1)
>Print 17 // 5, then 17 % 5, then 2 ** 3 on separate lines.|⟦print(17 // 5)§print(17 % 5)§print(2 ** 3)⟧||3§2§8|// drops the decimals and % keeps the remainder.
>Print 7 divided by 2, rounded to 1 decimal with round().|⟦print(round(7 / 2, 1))⟧||3.5|round(number, digits).
#1.4 Strings: indexing & slicing|A string is text in quotes. Index from 0, so "Python"[0] is "P", and negative indexes count from the end. Slice with [start:stop] (stop is not included). len() gives the length.
$s = "analytics"§print(s[0], s[-1])§print(s[2:6])§print(len(s))
>Print the first letter, the last letter and the first three letters on separate lines.|word = "Python"§⟦print(word[0])§print(word[-1])§print(word[:3])⟧||P§n§Pyt|Use [0], [-1] and [:3].
#1.5 String methods|Useful methods: .upper(), .lower(), .title(), .strip(), .replace(old, new), .split(sep), .find(x), .startswith(x). Strings can’t be changed; methods return new strings.
$s = "  Data Science  "§print(s.strip().upper())§print(s.lower().replace(" ", "_"))§print("a,b,c".split(","))
>Replace the dashes with spaces and print the text in Title Case.|text = "sales-report-2026"§⟦print(text.replace("-", " ").title())⟧||Sales Report 2026|Chain .replace() and .title().
>Split the sentence into words and print how many words it has.|s = "learn python every day"§⟦print(len(s.split()))⟧||4|.split() with no argument splits on spaces.
#1.6 f-strings & output formatting|f"..." puts values inside {}. {x:.2f} gives 2 decimals, {x:,} adds thousands commas, and print(a, b, sep="-") changes the separator. \n starts a new line.
$name, score = "Asha", 91.456§print(f"{name} scored {score:.1f}")§print(f"{1250000:,}")§print("a", "b", sep="-")
>Print Total: 1,234.50 from the number using one f-string.|n = 1234.5§⟦print(f"Total: {n:,.2f}")⟧||Total: 1,234.50|Combine the comma and .2f formats.
#1.7 Booleans, comparisons & logical operators|True and False are booleans. Compare with ==, !=, <, >, <= and >=, and combine tests with and, or, not. Empty values (0, "", []) count as False.
$x = 7§print(x > 5 and x < 10)§print(not x == 7)§print(bool(""), bool("hi"))
>Print True only if age is at least 18 and has_id is True.|age = 20§has_id = True§⟦print(age >= 18 and has_id)⟧||True|Join the two tests with and.
>Print whether the list is empty, using not.|items = []§⟦print(not items)⟧||True|An empty list is falsy, so not gives True.
#1.8 Type conversion & checking types|int("5"), float("2.5"), str(7) and bool(0) convert between types, and type(x) shows the type. input() reads keyboard text and always returns a string, so convert it before doing maths.
$n = int("25")§print(n + 1, type(n).__name__)§print(float("1.5") * 2)§print(str(99) + " items")
>Convert the two texts to numbers, add them and print the sum.|a = "12"§b = "30"§⟦print(int(a) + int(b))⟧||42|Without int(), + would join the text instead.
>Print the type name of 3.14 using type(...).__name__.|⟦print(type(3.14).__name__)⟧||float|type(x).__name__ gives the name as text.
%Module 2: Control Flow & Core Data Structures
#2.1 Conditionals: if, elif, else|if runs a block when a test is true, elif adds more tests, and else catches the rest. Indent the block by 4 spaces and end each test line with a colon.
$temp = 28§if temp > 35:§    print("Very hot")§elif temp > 25:§    print("Warm")§else:§    print("Cool")
>Write grade(score): return "A" for 90 or more, "B" for 75 or more, otherwise "C".|⟦def grade(score):§    if score >= 90:§        return "A"§    elif score >= 75:§        return "B"§    return "C"⟧|print(grade(95), grade(80), grade(40))|A B C|Check the highest score first.
#2.2 for loops & range()|for repeats a block for each item. range(n) gives 0 to n-1, range(a, b) starts at a, and range(a, b, step) jumps by step.
$for i in range(3):§    print("round", i)§for n in range(10, 0, -3):§    print(n)
>Print the numbers 1 to 5 on one line separated by spaces.|⟦for i in range(1, 6):§    print(i, end=" ")⟧||1 2 3 4 5|end=" " keeps the next print on the same line.
>Add up the numbers 1 to 100 with a loop and print the total.|⟦total = 0§for n in range(1, 101):§    total += n§print(total)⟧||5050|Start total at 0 and add each n.
#2.3 while loops, break & continue|while repeats as long as a test is true. break leaves the loop early and continue skips to the next round. Make sure something inside the loop changes, or it never ends.
$n = 3§while n > 0:§    print(n)§    n -= 1§print("Go!")
>Double the amount until it passes 100, then print it.|amount = 5§⟦while amount <= 100:§    amount *= 2§print(amount)⟧||160|Keep looping while amount is 100 or less.
#2.4 Lists: creating, indexing & slicing|A list holds ordered items in []. Index from 0, use negative indexes from the end, slice with [a:b], and change an item with lst[i] = value. len() counts the items.
$colors = ["red", "green", "blue"]§colors[1] = "teal"§print(colors, len(colors))§print(colors[-1], colors[1:])
>Print the second item, the last item and the first two items on separate lines.|fruits = ["apple", "banana", "cherry", "date"]§⟦print(fruits[1])§print(fruits[-1])§print(fruits[:2])⟧||banana§date§['apple', 'banana']|Index 1 is the second item.
#2.5 List methods & sorting|.append(x) adds, .insert(i, x) inserts, .remove(x) deletes by value, .pop() removes the last item, .sort() sorts in place, and sorted(lst) returns a new sorted list.
$nums = [4, 1, 3]§nums.append(9)§nums.sort()§print(nums)§print(nums.pop(), nums)
>Add "kiwi", remove "fig", then print the sorted list.|fruits = ["pear", "fig", "apple"]§⟦fruits.append("kiwi")§fruits.remove("fig")§print(sorted(fruits))⟧||['apple', 'kiwi', 'pear']|Use append, remove, then sorted.
#2.6 Tuples & unpacking|A tuple like (3, 4) is ordered but cannot be changed. Unpack it into names with x, y = point. Functions often return tuples.
$point = (3, 4)§x, y = point§print(x + y)§print(point[0])
>Unpack the record and print the name and the price.|record = ("Pen", 12, "stationery")§⟦name, price, _ = record§print(name, price)⟧||Pen 12|Unpack three values; _ is a throwaway name.
#2.7 Dictionaries|A dict stores key: value pairs. d["key"] reads a value, d["key"] = v sets one, .get(key, default) is safe, and .items() loops over pairs. Keys must be unique.
$stock = {"pen": 10, "book": 4}§stock["bag"] = 2§print(stock.get("ink", 0))§for k, v in stock.items():§    print(k, v)
>Add a "qty" of 3 to the dict, then print each key and value on its own line.|item = {"name": "Pen", "price": 12}§⟦item["qty"] = 3§for k, v in item.items():§    print(k, v)⟧||name Pen§price 12§qty 3|Set item["qty"] = 3, then loop over .items().
#2.8 Sets|A set holds unique, unordered items. set(list) removes duplicates, and a.union(b), a.intersection(b) and a.difference(b) combine sets. Checking x in s is very fast.
$a = {1, 2, 3}§b = {3, 4}§print(a.union(b))§print(a.difference(b))§print(len(set([1, 1, 2])))
>Print the sorted list of customers who bought in both months.|jan = {"ann", "raj", "sam"}§feb = {"raj", "sam", "lee"}§⟦print(sorted(jan.intersection(feb)))⟧||['raj', 'sam']|intersection keeps items found in both sets.
#2.9 Nested data & choosing a structure|Structures can nest, like a list of dicts for table rows. Use a list for order, a dict for lookups by key, a set for uniqueness and a tuple for fixed records.
$orders = [{"id": 1, "qty": 2}, {"id": 2, "qty": 5}]§print(orders[1]["qty"])§print([o["id"] for o in orders])
>Print the total price of all the rows.|rows = [{"item": "Pen", "price": 12}, {"item": "Book", "price": 150}]§⟦print(sum(r["price"] for r in rows))⟧||162|Read each r["price"] and add them up.
%Module 3: Functions, Modules, Files & Error Handling
#3.1 Defining functions: parameters & return|def name(parameters): defines a function and return sends a result back. A function with no return gives None. Call it as name(arguments).
$def greet(name):§    return "Hello, " + name§print(greet("Asha"))§print(greet("Ravi"))
>Write area(w, h) that returns the area of a rectangle.|⟦def area(w, h):§    return w * h⟧|print(area(4, 5))|20|Return w * h.
#3.2 Default & keyword arguments|A default value (rate=0.18) makes an argument optional. Keyword arguments name the parameter, like f(a=1, b=3). Put parameters with defaults last.
$def power(x, p=2):§    return x ** p§print(power(5))§print(power(2, p=5))
>Write price_with_tax(price, rate=0.18) returning the price plus tax, rounded to 2 decimals.|⟦def price_with_tax(price, rate=0.18):§    return round(price * (1 + rate), 2)⟧|print(price_with_tax(100), price_with_tax(100, rate=0.05))|118.0 105.0|Give rate a default of 0.18.

async function pyrun(code){let o='',p;const fl=()=>{try{p.runPython('import sys;sys.stdout.flush();sys.stderr.flush()')}catch(x){}};try{co('⏳ '+(PY?'Running…':'Loading the Python engine (one-time download, about 10 MB)…'),'');p=await eng();const dc=new TextDecoder(),wr={write:u=>{o+=dc.decode(u,{stream:true});return u.length}};p.setStdout(wr);p.setStderr(wr);await p.loadPackagesFromImports(code);await p.runPythonAsync(code,{globals:p.globals.get('dict')()});fl();return{o}}catch(e){fl();return{o,e:String(e.message||e)}}}
const stt=t=>t.c.replace(/⟦[\s\S]*?⟧/g,'# your code here'),esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function ed(v,b){$('sp').innerHTML=`${b}<textarea id="ce" spellcheck="false">${esc(v)}</textarea><div class="row">${F[cur].free?'<button class="b" onclick="rn()">Run ▶</button>':'<button class="g" onclick="rn()">Run ▶</button><button class="b" onclick="chk()">Check ✔</button><button class="g" onclick="hnt()">💡 Hint</button><button class="g" onclick="sol()">👁 Solution</button><button class="g" onclick="rst()">↺ Reset</button><button class="b" id="nb" hidden onclick="ns()">Next step ▶</button>'}</div><pre id="co">Write your code, then press Run to see the output${F[cur].free?'':' or Check to test it'}.</pre>`}
function rs(){const t=F[cur].st[si];ed(stt(t),`<b>Step ${si+1} of ${F[cur].st.length}</b><p>${ft(t.d)}</p>`)}
function ns(){si++;ht=tr=0;rs();say(F[cur].st[si].d)}
function rst(){$('ce').value=stt(F[cur].st[si])}
function hnt(){const t=F[cur].st[si];if(!t)return cn();ht++;const m='💡 Hint '+ht+': '+t.h;co(m,'');say(m)}
function sol(){const t=F[cur].st[si];if(ht+tr<2){say('Try a couple more times first. Hints are free. Then I’ll show the full solution.');return}$('ce').value=t.c.replace(/[⟦⟧]/g,'');say('Here is a full solution. Read it line by line, then press Reset and type it yourself.')}
async function rn(){const c=$('ce').value,r=await pyrun(c);if(r.e){lastE=why(r.e,c.split('\n').length);co('❌ '+lastE+(r.o.trim()?'\n\nOutput before the error:\n'+r.o:''),'bad');sfx.no();say(lastE)}else{co(r.o||'(Ran with no output. Use print() to show a result.)','');sfx.ok();if(C.il)say(r.o.trim()?'It printed: '+r.o.trim().slice(0,200).replace(/\n/g,', then '):'It ran without printing anything. Use print to show a result.')}}
async function chk(){const s=F[cur],t=s.st[si],c=$('ce').value;tr++;const r=await pyrun(c+'\n'+t.t);if(r.e){lastE=why(r.e,c.split('\n').length);co('❌ '+lastE+(r.o.trim()?'\n\nOutput before the error:\n'+r.o:''),'bad');sfx.no();if(C.il){T.aw={t:'yn',yes:hnt,no:()=>say('Okay. Take your time, and say check when you are ready.')};say(lastE+' Would you like a hint?')}else say(lastE)}else if(r.o.trim()==t.x.trim()){co('✅ Correct! Your output:\n'+r.o,'ok');sfx.ok();if(si+1<s.st.length){$('nb').hidden=false;if(C.il){T.aw={t:'yn',yes:ns,no:()=>say('Okay. Say next step whenever you are ready.')};say('Correct! Shall we move on to the next step?')}else say('Correct! Ready for the next step?',()=>C.a&&ns())}else{const x=s.xp||s.st.length*20;done[cur]=x;sv('pm5',done);hd();nav();win(s.t+' complete (+'+x+' XP)')}}else{lastE=cmp(r.o,t.x);co('❌ Not quite. '+lastE+'\n\nExpected:\n'+t.x+'\n\nYou got:\n'+(r.o.trim()||'(nothing)'),'bad');sfx.no();if(C.il){T.aw={t:'yn',yes:hnt,no:()=>say('Okay. Take your time, and say check when you are ready.')};say('Not quite. '+lastE+' Would you like a hint?')}else say('Not quite. '+lastE)}}
function ask(){const q=$('ci').value.toLowerCase(),s=F[cur];$('ci').value='';if(!s)return say('Open a lesson first, then ask me anything about it.');if(/hint|stuck|help/.test(q))return hnt();if(/solution|answer/.test(q)&&s.st.length)return sol();if(/error|wrong|bug|fail/.test(q))return say(lastE||'Run or check your code and I’ll explain any error in plain words.');say('Here’s the idea: '+s.c)}
function qv(){const s=F[cur],q=s.q[qi];ans=0;T.aw={t:'mcq'};$('st').innerHTML=`<span class="tag">${s.t} · Question ${qi+1} of ${s.q.length}</span><h2>${fm(q.q)}</h2>${q.o.map((o,j)=>`<button class="o" onclick="an(${j})">${'ABCD'[j]}. ${esc(o)}</button>`).join('')}<div id="fb"></div>`;say(sp(q.q)+' '+q.o.map((o,j)=>'ABCD'[j]+', '+sp(o)).join('. '))}
function an(j){if(ans)return;ans=1;T.aw=null;const s=F[cur],q=s.q[qi],ok=j==q.a,b=[...document.querySelectorAll('.o')];b[q.a].classList.add('ok');if(!ok)b[j].classList.add('no');if(ok)sc++;ok?sfx.ok():sfx.no();$('fb').innerHTML=`<p class="ex">${ok?'✅ Correct!':'❌ Not quite.'} ${fm(q.e)}</p><button class="b" onclick="nq()">${qi+1<s.q.length?'Next question ▶':'Finish ▶'}</button>`;say((ok?'Correct! ':'Not quite. ')+sp(q.e),()=>C.a&&nq())}
function nq(){qi++;qi<F[cur].q.length?qv():fin()}
function fin(){const s=F[cur],n=s.q.length;if(sc>=Math.ceil(n/2)){done[cur]=Math.max(done[cur]||0,sc*2);sv('pm5',done);hd();nav();win(s.t+': '+sc+' of '+n+' correct (+'+sc*2+' XP)')}else{$('st').innerHTML=`<h2>${sc} of ${n} correct</h2><p>Review the concept, then try again.</p><button class="b" onclick="mp(${cur})">Retry ↻</button>`;say('Good effort. Review the concept, then try again.')}}
